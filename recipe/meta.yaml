{% set name = "parsel" %}
{% set version = "1.11.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5925fe087eb16fc404a7ed91e31e2c1e2a9b230da4b64f34d81358c0d0e27e88

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling >=1.27.0
  run:
    - python
    - cssselect >=1.2.0
    - jmespath >=1.0.0
    - lxml >=5.1.0
    - packaging >=23.0
    - w3lib >=1.19.0

test:
  source_files:
    - tests
  imports:
    - parsel
  requires:
    - pip
    - pytest
    - psutil
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://github.com/scrapy/parsel
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: library to extract data from HTML and XML using XPath and CSS selectors
  description: |
    Features of parcel are, Extract text using CSS or XPath selectors and
    Regular expression helper methods.
  dev_url: https://github.com/scrapy/parsel
  doc_url: https://parsel.readthedocs.io/
